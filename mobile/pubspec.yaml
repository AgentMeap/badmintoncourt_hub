name: badminton_v2_mobile
description: "Nền tảng Quản lý & Đặt sân Cầu lông (3 Roles, 5 Flows, 6 Modules PRM393)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  intl: ^0.19.0
  video_player: ^2.9.2
  image_picker: ^1.1.2
  youtube_player_iframe: ^6.0.1
  url_launcher: ^6.3.2
  geolocator: ^14.0.2
  shared_preferences: ^2.3.2
  # Đăng nhập Google qua Firebase Auth (chỉ Android). Cấu hình: mobile/config/README_FIREBASE.md
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  # Thông báo đẩy (FCM) khi app chạy nền / đã đóng. Backend cần file service account (xem backend/application-secret.example.properties)
  firebase_messaging: ^16.4.3
  google_sign_in: ^7.2.0
  # Nút micro ở Trợ lý AI (S17): nhận dạng giọng nói tiếng Việt có sẵn trên máy
  speech_to_text: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Font Barlow (Google Fonts, giấy phép OFL) - nhúng sẵn để chạy offline
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
        - asset: assets/fonts/Barlow-ExtraBold.ttf
          weight: 800
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
