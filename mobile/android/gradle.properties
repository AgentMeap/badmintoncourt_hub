# This machine has 8 GB RAM: keep the Gradle daemon small and avoid a second
# (Kotlin daemon) JVM, otherwise the JVM fails to reserve memory and crashes.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=4
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Pub cache (C:) and project (D:) are on different drives; Kotlin incremental
# caches can't relativize cross-drive paths ("different roots").
kotlin.incremental=false
