# Chép file này thành application-secret.properties (cùng thư mục backend/) rồi điền key.
# application-secret.properties đã nằm trong .gitignore: KHÔNG đẩy lên GitHub.
# Để trống key nào thì tính năng đó chạy chế độ demo / dự phòng.

# Khóa ký JWT (chuỗi ngẫu nhiên >= 32 ký tự). Đổi khi chạy thật.
app.jwt.secret=

# Đăng nhập Google (Firebase Console > Project settings > Project ID)
app.firebase.project-id=

# Thông báo đẩy (FCM): Firebase Console > Project settings > Service accounts > Generate new private key.
# Lưu file JSON vào thư mục backend/ với tên firebase-service-account.json (đã nằm trong .gitignore).
app.fcm.credentials-file=

# Trợ lý AI - Google AI Studio: https://aistudio.google.com/apikey
app.gemini.api-key=
#app.gemini.model=gemini-2.5-flash

# Thanh toán VietQR PayOS - https://my.payos.vn > Kênh thanh toán
app.payos.client-id=
app.payos.api-key=
app.payos.checksum-key=

# Gửi OTP qua Gmail (Mật khẩu ứng dụng 16 ký tự, không phải mật khẩu Gmail)
spring.mail.username=
spring.mail.password=

# true: cho phép mật khẩu / OTP demo 123456 (để true khi trình bày đồ án)
app.demo-mode=true
