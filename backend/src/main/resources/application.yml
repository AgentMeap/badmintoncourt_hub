server:
  port: 8080

spring:
  application:
    name: badminton-v2-backend
  datasource:
    url: jdbc:sqlite:./badminton_v2.db?journal_mode=WAL&busy_timeout=10000&foreign_keys=ON
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:BadmintonV2SuperSecretKeyForPRM393Project2026!}
    expiration-ms: 604800000
  payos:
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    return-url: ${PAYOS_RETURN_URL:https://badminton-v2.demo/payment/success}
    cancel-url: ${PAYOS_CANCEL_URL:https://badminton-v2.demo/payment/cancel}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
