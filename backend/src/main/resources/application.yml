server:
  port: 8080

spring:
  application:
    name: badminton-v2-backend
  # Key bí mật đặt trong file này (đã nằm trong .gitignore), xem application-secret.example.properties
  config:
    import: optional:file:./application-secret.properties
  # Upload video trình độ: mặc định Spring chỉ cho 1 MB/file -> nâng bằng giới hạn của app (100 MB)
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB
  datasource:
    url: jdbc:sqlite:./badminton_v2.db?journal_mode=WAL&busy_timeout=10000&foreign_keys=ON
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

app:
  # true: chấp nhận mật khẩu / OTP demo "123456" và trả mã OTP trong phản hồi (trình bày trên lớp).
  # Đặt APP_DEMO_MODE=false khi chạy thật.
  demo-mode: ${APP_DEMO_MODE:true}
  firebase:
    # Project ID trong Firebase Console > Project settings (dùng để kiểm tra ID token đăng nhập Google)
    project-id: ${FIREBASE_PROJECT_ID:}
  jwt:
    secret: ${JWT_SECRET:BadmintonV2SuperSecretKeyForPRM393Project2026!}
    expiration-ms: 604800000
  payos:
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    return-url: ${PAYOS_RETURN_URL:https://badminton-v2.demo/payment/success}
    cancel-url: ${PAYOS_CANCEL_URL:https://badminton-v2.demo/payment/cancel}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
  # Thông báo đẩy (Firebase Cloud Messaging): đường dẫn file JSON service account. Trống = tắt đẩy.
  fcm:
    credentials-file: ${FCM_CREDENTIALS_FILE:}
  # Tìm đường theo đường phố (A* trên bản đồ OpenStreetMap tự dựng ở backend).
  # Lần đầu chạy: tự tải đường phố TP.HCM qua Overpass API (~15-30 phút, chạy nền),
  # lưu ở data-dir/hcm-roads.graph; các lần sau chỉ đọc file (vài giây).
  routing:
    enabled: ${ROUTING_ENABLED:true}
    data-dir: ${ROUTING_DATA_DIR:./data/routing}
    # nam,tây,bắc,đông: TP.HCM (trừ Cần Giờ) + Dĩ An / Thuận An
    bbox: ${ROUTING_BBOX:10.60,106.40,11.10,106.95}
    tile-size-deg: 0.1
    overpass-url: ${OVERPASS_URL:https://overpass-api.de/api/interpreter}
    auto-import: ${ROUTING_AUTO_IMPORT:true}
    # Nhân thời gian di chuyển cho xe (đèn đỏ, đông xe giờ cao điểm)
    traffic-factor: 1.15
    keep-tiles: false

# Ghi thêm log ra file UTF-8 (đọc bằng VS Code nếu cửa sổ PowerShell hiện lỗi font tiếng Việt)
logging:
  file:
    name: ./logs/backend.log
  charset:
    console: UTF-8
    file: UTF-8
